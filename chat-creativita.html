<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; margin: 0; background: #fdfbf7; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #D4AF37; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px; border-radius: 15px; max-width: 80%; font-size: 14px; line-height: 1.4; }
        .bot { background: white; align-self: flex-start; border: 1px solid #eee; color: #333; }
        .user { background: #D4AF37; color: white; align-self: flex-end; }
        #input-area { display: flex; padding: 12px; background: white; border-top: 1px solid #eee; }
        input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 15px; outline: none; }
        button { background: #D4AF37; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; margin-left: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="header">Asistente Creativita Shop 🌸</div>
    <div id="chat"><div class="msg bot">¡Hola! Soy Isabella. Ya casi termino de configurar mi sistema cuántico. ¿Qué producto de salud te interesa?</div></div>
    <div id="input-area">
        <input type="text" id="prompt" placeholder="Pregúntame algo...">
        <button onclick="enviar()">🚀</button>
    </div>

    <script>
        async function enviar() {
            const input = document.getElementById('prompt');
            const mensaje = input.value.trim();
            if(!mensaje) return;
            
            add(mensaje, 'user');
            input.value = '';

            // USANDO TU LLAVE ...VLcc DE LA IMAGEN 412f9a
            const api_key = "AIzaSyCuo4Z4uDJUI9CkOHyo2GxQQ6KVq5MVLcc"; 
            
            try {
                // Cambiamos a la versión v1 (más estable para llaves nuevas)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${api_key}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Eres Isabella de Creativita Shop, experta en salud. Responde corto y amable a: " + mensaje }] }] })
                });
                
                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    add(data.candidates[0].content.parts[0].text, 'bot');
                } else {
                    add("Mi sistema de Google se está reiniciando. Por favor, intenta de nuevo en un momento o escríbenos al WhatsApp.", 'bot');
                }
            } catch (e) {
                add("Error de conexión. Estamos estabilizando la señal.", 'bot');
            }
        }

        function add(t, c) {
            const div = document.createElement('div');
            div.className = 'msg ' + c;
            div.innerText = t;
            const chat = document.getElementById('chat');
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
