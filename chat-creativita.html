</div>

<style>
    #creativita-ai-v40 { position: fixed !important; z-index: 999999; bottom: 20px; left: 25px; font-family: 'Segoe UI', sans-serif; }
    #call-v40 { position: absolute; bottom: 85px; left: 0; background: #fff; padding: 7px 15px; border-radius: 20px; font-size: 11px; font-weight: bold; border: 2px solid #D4AF37; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    #win-v40 { width: 320px; background: #fff; border-radius: 18px; position: absolute; bottom: 85px; left: 0; box-shadow: 0 10px 40px rgba(0,0,0,0.4); border: 2px solid #D4AF37; flex-direction: column; overflow: hidden; }
    .msg-ia-v40 { background: #fff; padding: 12px; border-radius: 15px 15px 15px 0; align-self: flex-start; border: 1px solid #eee; font-size: 13px; max-width: 85%; color: #333; box-shadow: 2px 2px 5px rgba(0,0,0,0.05); }
    .msg-usr-v40 { background: #D4AF37; color: #fff; padding: 12px; border-radius: 15px 15px 0 15px; align-self: flex-end; font-size: 13px; max-width: 85%; }
</style>

<script>
(function() {
    const agentes = [
        { n: "Isabella", f: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiqDDq9ZB6967dWethT8kzi04kdlhpZ7_fGE5kKn9ATOIKUVqU13aklhLkVnO_HiJwSyuxIOvp-DWHj1xbUKJzsewX0UDroC6eQ6JhYxkzlcXTxY1JATiTfMdLznAXrl8GEqvyCimGSGY9WGjRgEqIimkX2V120Yti0cqoJ8Fn7cn12j0C6hMIofPdtg95c/s1600/callCenter.jpg" },
        { n: "Dayana", f: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgeWthUdXMC5y_NwxwBcLYnFHzGbWkGjTEKQWX2cv9oH7wiN4OcEKd0gE2B3Z6Y_Q-u21Jsndl3sHd3pn63aEFYg6SCk7pdDjXNI9gCWdwwnDjmct7iZQriFPSDtlijXEZpPIIEQyi5EgCrFwwZou0Ppj6Tq-hIayAgU6RsfxDIi85XKY7Ixmk8oMa_BrKd/s1600/ce7e99b2-agent--e1544463165980.webp" }
    ];

    const s = agentes[Math.floor(Math.random() * agentes.length)];
    document.getElementById('img-h-v40').src = s.f;
    document.getElementById('img-b-v40').src = s.f;
    document.getElementById('name-h-v40').innerText = "Asesora " + s.n;
    document.getElementById('wel-v40').innerText = "Hola, soy " + s.n + ". Estoy conectada a la base de datos de Creativita Shop. ¿En qué análisis puedo ayudarte hoy?";

    window.askV40 = async function() {
        const inp = document.getElementById('in-v40');
        const p = inp.value.trim();
        if(!p) return;

        addC(p, 'msg-usr-v40');
        inp.value = '';
        document.getElementById('type-v40').style.display = 'block';

        // LÓGICA MAESTRA: Si falla la conexión, es por la API KEY de Google bloqueada por Blogger.
        const apiKey = "AIzaSyCgN-AHpuo8nuP8mGGviF8-UMMuB48uwys"; 

        try {
            const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + apiKey, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "Eres una asesora experta de Creativita Shop. Analiza la duda del cliente usando la lógica de familias de productos, precios y profundidad informativa que no siempre está en el post. Sé amable pero vendedora: " + p }] }]
                })
            });

            const d = await res.json();
            const text = d.candidates[0].content.parts[0].text;
            document.getElementById('type-v40').style.display = 'none';
            addC(text, 'msg-ia-v40');
        } catch (e) {
            document.getElementById('type-v40').style.display = 'none';
            addC("Lo siento, el muro de seguridad de Blogger está interfiriendo. Para un análisis real sin bloqueos, por favor contáctame vía WhatsApp mientras restauro mi conexión cuántica.", 'msg-ia-v40');
        }
    };

    function addC(t, c) {
        const b = document.getElementById('body-v40');
        const div = document.createElement('div');
        div.className = c; div.innerText = t;
        b.insertBefore(div, document.getElementById('type-v40'));
        b.scrollTop = b.scrollHeight;
    }

    window.toggleV40 = function() {
        const w = document.getElementById('win-v40');
        w.style.display = w.style.display === 'none' ? 'flex' : 'none';
    };
})();
</script>
