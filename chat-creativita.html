<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #fdfbf7; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #D4AF37; color: white; padding: 15px; font-weight: bold; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 10px 14px; border-radius: 15px; font-size: 14px; line-height: 1.4; max-width: 80%; }
        .bot { background: white; border: 1px solid #eee; align-self: flex-start; color: #333; box-shadow: 2px 2px 5px rgba(0,0,0,0.05); }
        .user { background: #D4AF37; color: white; align-self: flex-end; }
        #input-area { padding: 12px; display: flex; background: white; border-top: 1px solid #eee; }
        input { flex: 1; border: 1px solid #ddd; border-radius: 20px; padding: 10px 15px; outline: none; }
        button { background: #D4AF37; border: none; color: white; border-radius: 50%; width: 40px; height: 40px; margin-left: 8px; cursor: pointer; font-size: 18px; }
        .dots { font-size: 12px; color: #888; font-style: italic; margin-left: 15px; display: none; }
    </style>
</head>
<body>
    <div id="header">Asistente Creativita Shop 🌸</div>
    <div id="chat-box">
        <div class="msg bot">¡Hola! Soy Isabella. He analizado nuestro catálogo de salud y precios por familias. ¿Qué producto o tratamiento buscas hoy?</div>
    </div>
    <div id="dots" class="dots">Analizando familias de productos...</div>
    <div id="input-area">
        <input type="text" id="user-in" placeholder="Pregúntame sobre salud y precios...">
        <button onclick="enviar()">🚀</button>
    </div>

    <script>
        const key = "AIzaSyCgN-AHpuo8nuP8mGGviF8-UMMuB48uwys";

        async function enviar() {
            const input = document.getElementById('user-in');
            const prompt = input.value.trim();
            if(!prompt) return;

            addMsg(prompt, 'user');
            input.value = '';
            document.getElementById('dots').style.display = 'block';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Eres una asesora experta en salud de Creativita Shop. Tu misión es analizar la duda del cliente. Si pregunta por precios, maneja familias de productos (Salud Articular, Energía, Pérdida de Peso). Da beneficios profundos y cierra la venta. Responde a: ${prompt}` }] }]
                    })
                });
                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                document.getElementById('dots').style.display = 'none';
                addMsg(reply, 'bot');
            } catch (e) {
                document.getElementById('dots').style.display = 'none';
                addMsg("Lo siento, mi conexión cuántica falló. ¿Podrías intentar de nuevo?", 'bot');
            }
        }

        function addMsg(t, s) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `msg ${s}`;
            div.innerText = t;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('user-in').onkeypress = (e) => { if(e.keyCode === 13) enviar(); };
    </script>
</body>
</html>
