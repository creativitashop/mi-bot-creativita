<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background: #fff; overflow: hidden; }
        .header { background: #D4AF37; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #chat { height: 380px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; }
        .m { padding: 10px 14px; border-radius: 18px; max-width: 85%; font-size: 14px; line-height: 1.4; }
        .u { background: #D4AF37; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .b { background: #fff; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        #in { display: flex; padding: 10px; background: #fff; border-top: 1px solid #eee; gap: 8px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 14px; }
        button { background: #D4AF37; border: none; color: white; padding: 0 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">Asistente Carolina ✨</div>
    <div id="chat">
        <div class="m b">¡Hola! Soy Carolina. ¿En qué puedo ayudarte con los productos RtaFull hoy?</div>
    </div>
    <div id="in">
        <input type="text" id="t" placeholder="Escribe tu mensaje...">
        <button onclick="s()">Enviar</button>
    </div>
    <script>
        const URL = 'https://mi-bot-creativita.creativitashopcoloficial.workers.dev/';
        async function s() {
            const i = document.getElementById('t'), c = document.getElementById('chat');
            if(!i.value) return;
            const v = i.value; i.value = '';
            c.innerHTML += `<div class="m u">${v}</div>`;
            c.scrollTop = c.scrollHeight;
            try {
                const r = await fetch(URL, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ mensaje: v }) 
                });
                const d = await r.json();
                const rta = d.candidates[0].content.parts[0].text;
                c.innerHTML += `<div class="m b">${rta}</div>`;
            } catch (e) { 
                c.innerHTML += `<div class="m b">Estoy procesando muchos pedidos, dame un segundo o pregúntame de nuevo.</div>`; 
            }
            c.scrollTop = c.scrollHeight;
        }
    </script>
</body>
</html>
