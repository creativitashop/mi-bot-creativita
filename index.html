<html lang="es">
<head>

    <title>Asistente RTAFULL</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: #f4f1ea; display: flex; flex-direction: column; height: 100vh; }

        #nombre-asesora { font-weight: bold; font-size: 16px; }
        #estado { font-size: 11px; opacity: 0.9; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 15px; border-radius: 18px; max-width: 80%; font-size: 14px; line-height: 1.4; }
        .bot { background: white; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #e0e0e0; color: #333; }
        .user { background: #D4AF37; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        #typing { font-size: 12px; color: #888; margin: 0 20px 15px; display: none; font-style: italic; }
        #input-area { display: flex; padding: 15px; background: white; border-top: 1px solid #eee; }
        input { flex: 1; border: 1px solid #ddd; border-radius: 25px; padding: 12px 18px; outline: none; }
        button { background: #D4AF37; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; margin-left: 8px; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
