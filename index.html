<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat de Ventas Oficial</title>
    <style>
        :root { --dorado: #D4AF37; --fondo: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--fondo); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #header { background: white; padding: 12px; display: flex; align-items: center; border-bottom: 3px solid var(--dorado); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--dorado); object-fit: cover; }
        .info { margin-left: 12px; }
        .info h2 { margin: 0; font-size: 16px; color: #333; }
        .info span { font-size: 11px; color: #28a745; font-weight: bold; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 85%; font-size: 14.5px; line-height: 1.5; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .bot { background: white; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #ddd; color: #444; }
        .user { background: var(--dorado); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        #input-area { background: white; padding: 15px; display: flex; border-top: 1px solid #eee; align-items: center; }
        input { flex: 1; border: 1px solid #ddd; border-radius: 25px; padding: 12px 18px; outline: none; font-size: 16px; }
        button { background: var(--dorado); border: none; width: 45px; height: 45px; border-radius: 50%; color: white; margin-left: 10px; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="header">
        <img src="" id="avatar">
        <div class="info"><h2 id="nom">Asesora</h2><span>En línea</span></div>
    </div>
    <div id="chat"></div>
    <div id="input-area">
        <input type="text" id="in" placeholder="Escribe tu duda aquí..." autocomplete="off">
        <button onclick="send()">🚀</button>
    </div>

    <script>
        let infoBlogTotal = ""; 
        let miAsesora = {};
        let saludoEnviado = false;

        window.addEventListener("message", (e) => {
            if (e.data.tipo === "CONFIG") {
                infoBlogTotal = e.data.info;
                miAsesora = e.data.asesora;
                document.getElementById('avatar').src = miAsesora.foto;
                document.getElementById('nom').innerText = miAsesora.nombre + " - Experta en Ventas";
                
                // SALUDO INICIAL: Solo se envía una vez al abrir el chat
                if(!saludoEnviado) {
                    add(`¡Hola! Soy <b>${miAsesora.nombre}</b>. 😊 Estoy aquí para ayudarte con tu pedido. ¿En qué ciudad te encuentras o qué duda tienes sobre el producto?`, 'bot');
                    saludoEnviado = true;
                }
            }
        });

        function send() {
            const val = document.getElementById('in').value.trim();
            if(!val) return;
            add(val, 'user'); 
            document.getElementById('in').value = '';
            
            setTimeout(() => {
                const m = val.toLowerCase();
                let r = "";

                // RESPUESTAS REACTIVAS BASADAS EN PALABRAS CLAVE E INFO DEL BLOG
                if (m.includes("precio") || m.includes("cuanto") || m.includes("valor")) {
                    r = "El precio del combo que estás viendo es de **$139.900**. 💰 Es precio de oferta directa de fábrica. ¿Te gustaría que te tomara los datos?";
                } 
                else if (m.includes("envio") || m.includes("donde") || m.includes("ciudad")) {
                    r = "Hacemos envíos a toda Colombia con pago seguro. 🚚 ¿A qué ciudad o municipio necesitas el despacho?";
                }
                else if (m.includes("info") || m.includes("beneficios") || m.includes("para que sirve") || m.includes("que es")) {
                    r = "Es un tratamiento integral: el Tyruss actúa como quemador potente y el Colágeno con Magnesio restaura tu piel y articulaciones. ✨ ¿Buscas algún resultado en específico?";
                }
                else if (m.includes("pago") || m.includes("pagar") || m.includes("cuenta")) {
                    r = "Manejamos diferentes medios de pago para tu comodidad. Una vez me confirmes tu ciudad, te doy los detalles para finalizar tu pedido. 😊";
                }
                else {
                    // Respuesta reactiva genérica si no entiende la palabra clave pero sigue la conversación
                    r = "Entiendo. Cuéntame un poco más para poder asesorarte mejor, o si prefieres, confírmame si deseas el combo de $139.900 que tenemos en promoción hoy.";
                }

                add(r, 'bot');
            }, 800);
        }

        function add(t, c) {
            const d = document.createElement('div'); d.className = 'msg ' + c; d.innerHTML = t;
            const chat = document.getElementById('chat');
            chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight;
        }
        document.getElementById('in').onkeypress = (e) => { if(e.key === 'Enter') send(); };
    </script>
</body>
</html>
