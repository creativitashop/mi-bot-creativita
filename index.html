<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background: #fff; overflow: hidden; }
        /* Bajamos el diseño 10px para que no se pegue al borde de arriba */
        .header { background: #D4AF37; color: white; padding: 15px 12px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); margin-top: 0; }
        .avatar-box { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #fff; overflow: hidden; background: #eee; flex-shrink: 0; }
        .avatar { width: 100%; height: 100%; object-fit: cover; }
        .info { display: flex; flex-direction: column; }
        .name { font-weight: bold; font-size: 15px; }
        .status { font-size: 11px; display: flex; align-items: center; gap: 4px; }
        .status::before { content: ''; width: 8px; height: 8px; background: #00ff00; border-radius: 50%; }
        #chat { height: 400px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; }
        .m { padding: 10px 14px; border-radius: 18px; max-width: 80%; font-size: 14px; }
        .u { background: #D4AF37; color: white; align-self: flex-end; }
        .b { background: #fff; color: #333; align-self: flex-start; border: 1px solid #eee; }
        #in { display: flex; padding: 12px; background: #fff; border-top: 1px solid #eee; gap: 8px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { background: #D4AF37; border: none; color: white; padding: 0 15px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <div class="avatar-box"><img id="v-img" class="avatar" src=""></div>
        <div class="info"><span id="v-nom" class="name">Asesora</span><span class="status">En línea</span></div>
    </div>
    <div id="chat"></div>
    <div id="in"><input type="text" id="t" placeholder="Escribe aquí..."><button onclick="s()">Enviar</button></div>

    <script>
        const equipo = [
            {n: "Valentina", f: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgeWthUdXMC5y_NwxwBcLYnFHzGbWkGjTEKQWX2cv9oH7wiN4OcEKd0gE2B3Z6Y_Q-u21Jsndl3sHd3pn63aEFYg6SCk7pdDjXNI9gCWdwwnDjmct7iZQriFPSDtlijXEZpPIIEQyi5EgCrFwwZou0Ppj6Tq-hIayAgU6RsfxDIi85XKY7Ixmk8oMa_BrKd/s1600/ce7e99b2-agent--e1544463165980.webp"},
            {n: "Dayana", f: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi4EJO6iV4Z-Itf2sYYwuqldfLYxibew0bjGGlCatlNCAdjLQvWU7RY4RWVkV8QybdiAmqGb829UIE56Zir7sj7lvafx8v09VoSS9sU5XLHh6lvzBKmBokxtngaYIMxFAn0U3V4ZM23rZZsyKYwKM8nA7_ZVYMJ9AEqc8dowQUzE78mM8Rhr2klWIdISk5y/s1600/StockCake-Friendly-Call-Center_1723420268.webp"}
        ];

        const r = equipo[Math.floor(Math.random() * equipo.length)];
        document.getElementById('v-img').src = r.f;
        document.getElementById('v-nom').innerText = r.n;

        const chat = document.getElementById('chat');
        chat.innerHTML = `<div class="m b">Hola, soy ${r.n}. ¿Qué producto buscas hoy?</div>`;

        async function s() {
            const i = document.getElementById('t');
            if(!i.value) return;
            const v = i.value; i.value = '';
            chat.innerHTML += `<div class="m u">${v}</div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                // USAMOS TU URL REAL DE CLOUDFLARE
                const res = await fetch('https://tiny-cloud-4692.creativita-110.workers.dev/', {
                    method: 'POST',
                    mode: 'cors', // ESTO ES VITAL PARA QUE NO BLOQUEE
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ mensaje: v })
                });
                const d = await res.json();
                chat.innerHTML += `<div class="m b">${d.candidates[0].content.parts[0].text}</div>`;
            } catch (e) {
                chat.innerHTML += `<div class="m b">Danos un momento, estamos verificando stock.</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
