<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background: #fff; overflow: hidden; }
        .header { background: #D4AF37; color: white; padding: 12px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .avatar-box { width: 50px; height: 50px; flex-shrink: 0; border-radius: 50%; border: 2px solid #fff; overflow: hidden; background: #eee; }
        .avatar { width: 100%; height: 100%; object-fit: cover; }
        .info { display: flex; flex-direction: column; }
        .name { font-weight: bold; font-size: 15px; }
        .status { font-size: 11px; display: flex; align-items: center; gap: 4px; }
        .status::before { content: ''; width: 8px; height: 8px; background: #00ff00; border-radius: 50%; }
        #chat { height: 380px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; }
        .m { padding: 10px 14px; border-radius: 18px; max-width: 80%; font-size: 14px; }
        .u { background: #D4AF37; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .b { background: #eee; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        #in { display: flex; padding: 10px; background: #fff; border-top: 1px solid #eee; gap: 8px; }
        input { flex: 1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { background: #D4AF37; border: none; color: white; padding: 0 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <div class="avatar-box"><img id="v-img" class="avatar" src=""></div>
        <div class="info"><span id="v-nom" class="name">Asesora</span><span class="status">En línea</span></div>
    </div>
    <div id="chat"></div>
    <div id="in"><input type="text" id="t" placeholder="Pregúntame lo que quieras..."><button onclick="s()">Enviar</button></div>

    <script>
        const equipo = [
            {n: "Valentina", f: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgeWthUdXMC5y_NwxwBcLYnFHzGbWkGjTEKQWX2cv9oH7wiN4OcEKd0gE2B3Z6Y_Q-u21Jsndl3sHd3pn63aEFYg6SCk7pdDjXNI9gCWdwwnDjmct7iZQriFPSDtlijXEZpPIIEQyi5EgCrFwwZou0Ppj6Tq-hIayAgU6RsfxDIi85XKY7Ixmk8oMa_BrKd/s1600/ce7e99b2-agent--e1544463165980.webp"},
            {n: "Dayana", f: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi4EJO6iV4Z-Itf2sYYwuqldfLYxibew0bjGGlCatlNCAdjLQvWU7RY4RWVkV8QybdiAmqGb829UIE56Zir7sj7lvafx8v09VoSS9sU5XLHh6lvzBKmBokxtngaYIMxFAn0U3V4ZM23rZZsyKYwKM8nA7_ZVYMJ9AEqc8dowQUzE78mM8Rhr2klWIdISk5y/s1600/StockCake-Friendly-Call-Center_1723420268.webp"},
            {n: "Carolina", f: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiqDDq9ZB6967dWethT8kzi04kdlhpZ7_fGE5kKn9ATOIKUVqU13aklhLkVnO_HiJwSyuxIOvp-DWHj1xbUKJzsewX0UDroC6eQ6JhYxkzlcXTxY1JATiTfMdLznAXrl8GEqvyCimGSGY9WGjRgEqIimkX2V120Yti0cqoJ8Fn7cn12j0C6hMIofPdtg95c/s1600/callCenter.jpg"},
            {n: "Estefanía", f: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjdjwIeoO7YnjtpkXiXxFKUiSy8ssQGvsD85vXebU4buDEXgWV0_6LwQzXAO2172qBVamwBLKczRRWpP4MJOGFm6ImQ7WMVK0ghkQZNupB-__Upf3e0j2FInTxeGOs7cZfGgGnBH5WeQ0tVOQOfZrxXMJKpeT4bXz8VHjKEsWQ6MAQJspN43SU_fw54uo7N/s1600/telemarketing_002.jpg"},
            {n: "Sofía", f: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjj8UIYW0ose63ONacNpqFaV35lkGDDm-PYj_kWP7D_RIoxFUAe2bLr0d9L3lB-I9LDYFl6TmyrRMu557lQXWM-DU329joWK73qKPeS9kUmmBbXv8hUhETNKVBZG7HHALhOs_8AIj9zKj8tr6UZl7FvF18jr-jCF-XSN-GuZGSR1YFtQuzBhKB068YXv3o8/s1600/que-es-una-diadema-inalambrica.jpg"}
        ];

        const r = equipo[Math.floor(Math.random() * equipo.length)];
        document.getElementById('v-img').src = r.f;
        document.getElementById('v-nom').innerText = r.n;

        const chat = document.getElementById('chat');
        chat.innerHTML = `<div class="m b">¡Hola! Soy <b>${r.n}</b>. Estoy aquí para asesorarte con cualquier producto de la tienda. ¿En qué te ayudo?</div>`;

        const URL = 'https://mi-bot-creativita.creativitashopcoloficial.workers.dev/';

        async function s() {
            const i = document.getElementById('t');
            if(!i.value) return;
            const v = i.value; i.value = '';
            chat.innerHTML += `<div class="m u">${v}</div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch(URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ mensaje: v }) });
                const d = await res.json();
                const rta = d.candidates[0].content.parts[0].text;
                chat.innerHTML += `<div class="m b">${rta}</div>`;
            } catch (e) {
                chat.innerHTML += `<div class="m b">Dame un segundo, hay mucha gente comprando...</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
