<script>
    async function enviar() {
        const input = document.getElementById('prompt');
        const msg = input.value.trim();
        if(!msg) return;
        add(msg, 'user');
        input.value = '';

        const k = "AIzaSyAdFnI6xHkmIHanSTZC4IIh7rxXyvhqS58";
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${k}`;

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: msg }] }],
                    // ESTO APAGA LOS FILTROS PARA QUE NO TE BLOQUEE POR SEGURIDAD
                    safetySettings: [
                        { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                        { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                        { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                        { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                    ]
                })
            });
            
            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content) {
                add(data.candidates[0].content.parts[0].text, 'bot');
            } else {
                // SI FALLA, NOS VA A DECIR EL ERROR REAL EN LA PANTALLA
                add("Error de Google: " + (data.error ? data.error.message : "Respuesta vacía"), "bot");
            }
        } catch (e) {
            add("Fallo de red total.", "bot");
        }
    }
</script>
