<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat Carolina</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 10px; background: #fff; }
        #chat-box { height: 400px; overflow-y: auto; border: 1px solid #eee; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; }
        .msg { margin: 5px 0; padding: 8px 12px; border-radius: 15px; max-width: 80%; }
        .user { background: #D4AF37; color: white; align-self: flex-end; }
        .bot { background: #f1f1f1; color: #333; align-self: flex-start; }
        #input-area { display: flex; gap: 5px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; }
        button { background: #D4AF37; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat-box"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Escribe tu duda sobre RtaFull...">
        <button onclick="sendMsg()">Enviar</button>
    </div>

    <script>
        const WORKER_URL = 'https://mi-bot-creativita.creativitashopcoloficial.workers.dev/';

        async function sendMsg() {
            const input = document.getElementById('user-input');
            const box = document.getElementById('chat-box');
            if(!input.value) return;

            const val = input.value;
            box.innerHTML += `<div class="msg user">${val}</div>`;
            input.value = '';

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ mensaje: val })
                });
                const data = await res.json();
                const rta = data.candidates[0].content.parts[0].text;
                box.innerHTML += `<div class="msg bot">${rta}</div>`;
            } catch (e) {
                box.innerHTML += `<div class="msg bot">Carolina está descansando, intenta en un momento.</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
