<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background: #fff; overflow: hidden; }
        .header { background: #D4AF37; color: white; padding: 10px 15px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        /* Aquí corregimos el círculo de la foto */
        .avatar-container { width: 50px; height: 50px; flex-shrink: 0; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #fff; object-fit: cover; display: block; }
        .info { display: flex; flex-direction: column; overflow: hidden; }
        .name { font-weight: bold; font-size: 15px; white-space: nowrap; text-overflow: ellipsis; }
        .status { font-size: 11px; display: flex; align-items: center; gap: 4px; }
        .status::before { content: ''; width: 8px; height: 8px; background: #00ff00; border-radius: 50%; }
        
        #chat { height: 380px; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: #f4f4f4; }
        .m { padding: 10px 14px; border-radius: 15px; max-width: 80%; font-size: 14px; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .u { background: #D4AF37; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .b { background: #fff; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        #in { display: flex; padding: 12px; background: #fff; border-top: 1px solid #ddd; gap: 8px; }
        input { flex: 1; padding: 10px 15px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        button { background: #D4AF37; border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="header">
        <div class="avatar-container">
            <img id="p-img" class="avatar" src="" alt="Asesora">
        </div>
        <div class="info">
            <span id="p-nom" class="name">Asesora</span>
            <span class="status">En línea ahora</span>
        </div>
    </div>
    <div id="chat"></div>
    <div id="in">
        <input type="text" id="t" placeholder="Escribe tu mensaje...">
        <button onclick="s()">➤</button>
    </div>

    <script>
        // Tus 5 asesoras con los links que me diste
        const equipo = [
            {n: "Valentina", f: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgeWthUdXMC5y_NwxwBcLYnFHzGbWkGjTEKQWX2cv9oH7wiN4OcEKd0gE2B3Z6Y_Q-u21Jsndl3sHd3pn63aEFYg6SCk7pdDjXNI9gCWdwwnDjmct7iZQriFPSDtlijXEZpPIIEQyi5EgCrFwwZou0Ppj6Tq-hIayAgU6RsfxDIi85XKY7Ixmk8oMa_BrKd/s1600/ce7e99b2-agent--e1544463165980.webp"},
            {n: "Dayana", f: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi4EJO6iV4Z-Itf2sYYwuqldfLYxibew0bjGGlCatlNCAdjLQvWU7RY4RWVkV8QybdiAmqGb829UIE56Zir7sj7lvafx8v09VoSS9sU5XLHh6lvzBKmBokxtngaYIMxFAn0U3V4ZM23rZZsyKYwKM8nA7_ZVYMJ9AEqc8dowQUzE78mM8Rhr2klWIdISk5y/s1600/StockCake-Friendly-Call-Center_1723420268.webp"},
            {n: "Carolina", f: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiqDDq9ZB6967dWethT8kzi04kdlhpZ7_fGE5kKn9ATOIKUVqU13aklhLkVnO_HiJwSyuxIOvp-DWHj1xbUKJzsewX0UDroC6eQ6JhYxkzlcXTxY1JATiTfMdLznAXrl8GEvyCimGSGY9WGjRgEqIimkX2V120Yti0cqoJ8Fn7cn12j0C6hMIofPdtg95c/s1600/callCenter.jpg"},
            {n: "Estefanía", f: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjdjwIeoO7YnjtpkXiXxFKUiSy8ssQGvsD85vXebU4buDEXgWV0_6LwQzXAO2172qBVamwBLKczRRWpP4MJOGFm6ImQ7WMVK0ghkQZNupB-__Upf3e0j2FInTxeGOs7cZfGgGnBH5WeQ0tVOQOfZrxXMJKpeT4bXz8VHjKEsWQ6MAQJspN43SU_fw54uo7N/s1600/telemarketing_002.jpg"},
            {n: "Sofía", f: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjj8UIYW0ose63ONacNpqFaV35lkGDDm-PYj_kWP7D_RIoxFUAe2bLr0d9L3lB-I9LDYFl6TmyrRMu557lQXWM-DU329joWK73qKPeS9kUmmBbXv8hUhETNKVBZG7HHALhOs_8AIj9zKj8tr6UZl7FvF18jr-jCF-XSN-GuZGSR1YFtQuzBhKB068YXv3o8/s1600/que-es-una-diadema-inalambrica.jpg"}
        ];

        // Elegir una al azar
        const a = equipo[Math.floor(Math.random() * equipo.length)];
        document.getElementById('p-img').src = a.f;
        document.getElementById('p-nom').innerText = a.n;

        const chat = document.getElementById('chat');
        chat.innerHTML = `<div class="m b">Hola, soy <b>${a.n}</b>. ¿En qué puedo asesorarte hoy con nuestros productos?</div>`;

        const URL = 'https://mi-bot-creativita.creativitashopcoloficial.workers.dev/';

        async function s() {
            const i = document.getElementById('t');
            if(!i.value) return;
            const v = i.value; i.value = '';
            chat.innerHTML += `<div class="m u">${v}</div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                const r = await fetch(URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ mensaje: v }) });
                const d = await r.json();
                const rta = d.candidates[0].content.parts[0].text;
                chat.innerHTML += `<div class="m b">${rta}</div>`;
            } catch (e) {
                chat.innerHTML += `<div class="m b">Dame un segundo, estoy consultando stock...</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
