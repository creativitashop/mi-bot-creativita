<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root { --dorado: #D4AF37; --fondo: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--fondo); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #header { background: white; padding: 12px; display: flex; align-items: center; border-bottom: 3px solid var(--dorado); }
        #avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--dorado); object-fit: cover; }
        .info { margin-left: 12px; }
        .info h2 { margin: 0; font-size: 16px; color: #333; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 85%; font-size: 14px; line-height: 1.4; }
        .bot { background: white; align-self: flex-start; border: 1px solid #ddd; border-bottom-left-radius: 2px; }
        .user { background: var(--dorado); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        #input-area { background: white; padding: 15px; display: flex; border-top: 1px solid #eee; }
        input { flex: 1; border: 1px solid #ddd; border-radius: 25px; padding: 12px 18px; outline: none; font-size: 16px; }
        button { background: var(--dorado); border: none; width: 45px; height: 45px; border-radius: 50%; color: white; margin-left: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="header">
        <img src="" id="avatar">
        <div class="info"><h2 id="nom">Cargando...</h2><span style="color:#28a745; font-size:11px; font-weight:bold;">● En línea</span></div>
    </div>
    <div id="chat"></div>
    <div id="input-area">
        <input type="text" id="in" placeholder="Escribe tu duda aquí...">
        <button onclick="send()">🚀</button>
    </div>

    <script>
        let infoDelBlog = ""; let miAsesora = {}; let historial = [];

        window.addEventListener("message", (e) => {
            if (e.data.tipo === "CONFIG") {
                infoDelBlog = e.data.info; miAsesora = e.data.asesora;
                document.getElementById('avatar').src = miAsesora.foto;
                document.getElementById('nom').innerText = miAsesora.nombre;
                if(!historial.length) addMsg(`¡Hola! Soy <b>${miAsesora.nombre}</b>. ¿En qué ciudad estás? Vi que te interesa nuestra oferta de hoy. 😊`, 'bot');
            }
        });

        function send() {
            const txt = document.getElementById('in').value.trim();
            if(!txt) return;
            addMsg(txt, 'user');
            document.getElementById('in').value = '';

            setTimeout(() => {
                const m = txt.toLowerCase();
                let r = "";

                // LÓGICA DE INTENCIÓN (No se queda pegada)
                if (m.includes("precio") || m.includes("cuanto") || m.includes("valor") || m.includes("$")) {
                    r = "El precio especial hoy es de **$139.900**. 💰 Es el mejor precio del mercado para este combo. ¿Te gustaría que te lo separe?";
                } 
                else if (m.includes("envio") || m.includes("llega") || m.includes("ciudad") || m.includes("donde")) {
                    r = "Realizamos envíos seguros a toda Colombia. 🚚 Cuéntame en qué ciudad estás para confirmarte el tiempo de entrega.";
                }
                else if (m.includes("info") || m.includes("beneficios") || m.includes("sirve") || m.includes("colageno") || m.includes("rta")) {
                    r = "Es un tratamiento potente: el Tyruss ayuda con la grasa y el Colágeno con Magnesio restaura tu piel y energía. ✨ ¿Buscas algún resultado en especial?";
                }
                else if (m.includes("pago") || m.includes("pagar") || m.includes("nequi") || m.includes("bancolombia")) {
                    r = "Aceptamos Nequi, Bancolombia y otros medios seguros. 💳 Una vez confirmes tu pedido, te paso los datos exactos.";
                }
                else if (m.includes("hola") || m.includes("buenas")) {
                    r = `¡Hola! Aquí sigo atenta. ¿Tienes alguna duda específica sobre el combo de $139.900 o quieres ver cómo comprar?`;
                }
                else {
                    // Respuesta variable para evitar el bucle de las capturas
                    const opciones = [
                        "Entiendo. Cuéntame más para poder asesorarte bien. 😊",
                        "¡Excelente! ¿Quieres que te ayude con el proceso de pago o tienes dudas del envío?",
                        "Como tu asesora, te recomiendo aprovechar la oferta actual. ¿Qué otra duda tienes?"
                    ];
                    r = opciones[Math.floor(Math.random() * opciones.length)];
                }

                addMsg(r, 'bot');
            }, 700);
        }

        function addMsg(t, c) {
            const d = document.createElement('div'); d.className = 'msg ' + c; d.innerHTML = t;
            const chat = document.getElementById('chat'); chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight; historial.push(t);
        }
        document.getElementById('in').onkeypress = (e) => { if(e.key === 'Enter') send(); };
    </script>
</body>
</html>
