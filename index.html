<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayana - Asesora RTAFULL</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f1ea; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #D4AF37; color: white; padding: 15px; text-align: center; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 80%; font-size: 14px; line-height: 1.4; position: relative; }
        .bot { background: white; align-self: flex-start; border: 1px solid #ddd; color: #333; }
        .user { background: #D4AF37; color: white; align-self: flex-end; }
        #input-area { display: flex; padding: 15px; background: white; border-top: 1px solid #eee; }
        input { flex: 1; border: 1px solid #ddd; border-radius: 25px; padding: 12px 18px; outline: none; font-size: 14px; }
        button { background: #D4AF37; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; margin-left: 10px; cursor: pointer; font-size: 20px; transition: 0.3s; }
        button:hover { background: #b8962d; }
        #typing { font-size: 12px; color: #888; margin: 0 0 10px 20px; display: none; }
    </style>
</head>
<body>
    <div id="header">Dayana - Asesora RTAFULL</div>
    <div id="chat"><div class="msg bot">¡Hola! Soy Dayana de RTAFULL. 😊 ¿En qué ciudad te encuentras para cotizarte el envío?</div></div>
    <div id="typing">Dayana está escribiendo...</div>
    <div id="input-area">
        <input type="text" id="prompt" placeholder="Escribe tu mensaje aquí..." autocomplete="off">
        <button onclick="enviar()">🚀</button>
    </div>

    <script>
        async function enviar() {
            const input = document.getElementById('prompt');
            const texto = input.value.trim();
            if(!texto) return;
            
            add(texto, 'user');
            input.value = '';
            document.getElementById('typing').style.display = 'block';

            // TU LLAVE VIVA DE LA IMAGEN image_2323dd.png
            const p1 = "hf_yajxyoQZrASiLVX"; 
            const p2 = "rNTARGUhxmvuwKbpji"; 

            try {
                // Modelo Mistral: El más rápido para servidores gratuitos
                const response = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2", {
                    method: "POST",
                    headers: { "Authorization": "Bearer " + p1 + p2, "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        inputs: "<s>[INST] Eres Dayana, vendedora amable de RTAFULL. Responde de forma muy corta: " + texto + " [/INST]" 
                    })
                });
                
                const data = await response.json();
                document.getElementById('typing').style.display = 'none';
                
                if (Array.isArray(data) && data[0].generated_text) {
                    let r = data[0].generated_text.split("[/INST]")[1] || data[0].generated_text;
                    add(r.trim(), 'bot');
                } else if (data.error && data.error.includes("loading")) {
                    add("¡Hola! Estoy preparando la información. Dame 10 segundos y vuelve a decir 'Hola'. 😊", 'bot');
                } else {
                    add("¡Con gusto! ¿Para qué ciudad sería el envío?", 'bot');
                }
            } catch (e) {
                document.getElementById('typing').style.display = 'none';
                add("Estamos recibiendo muchos pedidos. Intenta de nuevo en un segundo. 😊", 'bot');
            }
        }

        function add(t, c) {
            const div = document.createElement('div');
            div.className = 'msg ' + c;
            div.innerText = t;
            const chat = document.getElementById('chat');
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        document.getElementById('prompt').addEventListener('keypress', (e) => { if (e.key === 'Enter') enviar(); });
    </script>
</body>
</html>
