<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root { --dorado: #D4AF37; --fondo: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--fondo); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #header { background: white; padding: 12px; display: flex; align-items: center; border-bottom: 3px solid var(--dorado); }
        #avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--dorado); object-fit: cover; }
        .info { margin-left: 12px; }
        .info h2 { margin: 0; font-size: 16px; color: #333; }
        .info span { font-size: 12px; color: #28a745; font-weight: bold; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 85%; font-size: 14px; line-height: 1.5; }
        .bot { background: white; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #ddd; }
        .user { background: var(--dorado); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        #input-area { background: white; padding: 15px; display: flex; border-top: 1px solid #eee; }
        input { flex: 1; border: 1px solid #ddd; border-radius: 25px; padding: 12px 18px; outline: none; font-size: 16px; }
        button { background: var(--dorado); border: none; width: 45px; height: 45px; border-radius: 50%; color: white; margin-left: 10px; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>
    <div id="header">
        <img src="" id="avatar">
        <div class="info"><h2 id="nom">Asesora</h2><span>En línea</span></div>
    </div>
    <div id="chat"></div>
    <div id="input-area">
        <input type="text" id="in" placeholder="Escribe aquí...">
        <button onclick="send()">🚀</button>
    </div>

    <script>
        let dataPost = ""; let miAsesora = {};
        window.addEventListener("message", (e) => {
            if (e.data.tipo === "CONFIG") {
                dataPost = e.data.info; miAsesora = e.data.asesora;
                document.getElementById('avatar').src = miAsesora.foto;
                document.getElementById('nom').innerText = miAsesora.nombre + " - Ventas";
                if(!document.getElementById('chat').innerHTML) add(`¡Hola! Soy <b>${miAsesora.nombre}</b>. ¿En qué ciudad estás? Vi que te interesa nuestro combo de $139.900. 😊`, 'bot');
            }
        });

        function send() {
            const val = document.getElementById('in').value.trim();
            if(!val) return;
            add(val, 'user'); document.getElementById('in').value = '';
            
            setTimeout(() => {
                let r = "Claro que sí. Cuéntame, ¿tienes alguna duda con el envío o prefieres que te confirme los medios de pago para el combo de $139.900? 🚚";
                const m = val.toLowerCase();
                if(m.includes("hola")) r = `¡Hola de nuevo! Aquí sigo pendiente. ¿Te gustaría aprovechar la oferta del post hoy mismo?`;
                if(m.includes("precio") || m.includes("cuanto") || m.includes("valor")) r = "El precio es de **$139.900** por el combo completo. ¡Es precio de fábrica! 💰";
                if(m.includes("colageno") || m.includes("informacion") || m.includes("info")) r = "El Colágeno Hidrolizado con Citrato de Magnesio ayuda a tu piel y huesos. ✨ Viene en el Combo 1 junto al Tyruss. ¿Te gustaría ver más beneficios?";
                add(r, 'bot');
            }, 800);
        }

        function add(t, c) {
            const d = document.createElement('div'); d.className = 'msg ' + c; d.innerHTML = t;
            document.getElementById('chat').appendChild(d);
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        }
        document.getElementById('in').onkeypress = (e) => { if(e.key === 'Enter') send(); };
    </script>
</body>
</html>
