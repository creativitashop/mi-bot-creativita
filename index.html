<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayana - RTAFULL</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f1ea; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #D4AF37; color: white; padding: 15px; font-weight: bold; text-align: center; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; margin-bottom: 5px; }
        .bot { background: white; align-self: flex-start; border: 1px solid #ddd; }
        .user { background: #D4AF37; color: white; align-self: flex-end; }
        #input-area { display: flex; padding: 10px; background: white; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ddd; outline: none; }
        button { background: #D4AF37; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; margin-left: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="header">Dayana - Asesora RTAFULL</div>
    <div id="chat"><div class="msg bot">¡Hola! Soy Dayana. 😊 ¿A qué ciudad va tu pedido?</div></div>
    <div id="input-area">
        <input type="text" id="prompt" placeholder="Escribe aquí..." autocomplete="off">
        <button onclick="enviar()">🚀</button>
    </div>

    <script>
        async function enviar() {
            const input = document.getElementById('prompt');
            const texto = input.value.trim();
            if(!texto) return;
            add(texto, 'user');
            input.value = '';

            // LLAVE DE LA IMAGEN image_2323dd.png
            const p1 = "hf_yajxyoQZrASiLVX"; 
            const p2 = "rNTARGUhxmvuwKbpji"; 

            try {
                const response = await fetch("https://api-inference.huggingface.co/models/facebook/blenderbot-400M-distill", {
                    method: "POST",
                    headers: { "Authorization": "Bearer " + p1 + p2, "Content-Type": "application/json" },
                    body: JSON.stringify({ inputs: texto })
                });
                
                const data = await response.json();
                
                if (data.error && data.error.includes("loading")) {
                    add("Estoy despertando, dame 15 segundos y vuelve a decir 'Hola'. 😊", 'bot');
                } else if (data.generated_text) {
                    add(data.generated_text, 'bot');
                } else if (Array.isArray(data) && data[0].generated_text) {
                    add(data[0].generated_text, 'bot');
                } else {
                    add("Recibí tu mensaje, pero el servidor está procesando. Intenta de nuevo. 😊", 'bot');
                }
            } catch (e) {
                add("Error de conexión. Revisa que tu internet esté bien e intenta de nuevo. 😊", 'bot');
            }
        }

        function add(t, c) {
            const div = document.createElement('div');
            div.className = 'msg ' + c;
            div.innerText = t;
            const chat = document.getElementById('chat');
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
