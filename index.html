<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayana RTAFULL</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f1ea; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #D4AF37; color: white; padding: 15px; display: flex; align-items: center; gap: 10px; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px; border-radius: 15px; max-width: 80%; line-height: 1.4; }
        .bot { background: white; align-self: flex-start; border: 1px solid #ddd; }
        .user { background: #D4AF37; color: white; align-self: flex-end; }
        #input-area { display: flex; padding: 15px; background: white; border-top: 1px solid #eee; }
        input { flex: 1; border: 1px solid #ddd; border-radius: 25px; padding: 12px; outline: none; }
        button { background: #D4AF37; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; margin-left: 10px; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>
    <div id="header">
        <div style="width: 40px; height: 40px; border-radius: 50%; background: #eee; border: 2px solid white;"></div>
        <b>Dayana RTAFULL</b>
    </div>
    <div id="chat"><div class="msg bot">¡Hola! Soy Dayana. 😊 ¿A qué ciudad va tu pedido?</div></div>
    <div id="input-area">
        <input type="text" id="prompt" placeholder="Escribe aquí...">
        <button onclick="enviar()">🚀</button>
    </div>

    <script>
        async function enviar() {
            const input = document.getElementById('prompt');
            const texto = input.value.trim();
            if(!texto) return;
            
            add(texto, 'user');
            input.value = '';

            try {
                // USAMOS MISTRAL (HUGGING FACE) - MENOS CANDADOS QUE GOOGLE
                const response = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.2", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": "Bearer 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" // Token temporal de prueba
                    },
                    body: JSON.stringify({ inputs: "Responde como Dayana, vendedora amable. Cliente dice: " + texto })
                });
                
                const data = await response.json();
                let r = data[0].generated_text.split("Cliente dice:")[1] || data[0].generated_text;
                add(r.trim(), 'bot');
            } catch (e) {
                add("Dame un segundo, estoy verificando inventario. 😊", 'bot');
            }
        }

        function add(t, c) {
            const div = document.createElement('div');
            div.className = 'msg ' + c;
            div.innerText = t;
            document.getElementById('chat').appendChild(div);
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        }
    </script>
</body>
</html>
