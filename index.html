<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Dayana</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f4f1ea; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #header { background: #D4AF37; color: white; padding: 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #perfil-img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid white; object-fit: cover; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 10px 15px; border-radius: 18px; max-width: 80%; font-size: 14px; word-wrap: break-word; }
        .bot { background: white; align-self: flex-start; border: 1px solid #e0e0e0; color: #333; }
        .user { background: #D4AF37; color: white; align-self: flex-end; }
        #input-area { display: flex; padding: 15px; background: white; border-top: 1px solid #eee; }
        input { flex: 1; border: 1px solid #ddd; border-radius: 25px; padding: 12px 18px; outline: none; font-size: 14px; }
        button { background: #D4AF37; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; margin-left: 8px; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        button:hover { background: #b8962d; }
    </style>
</head>
<body>
    <div id="header">
        <img id="perfil-img" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgeWthUdXMC5y_NwxwBcLYnFHzGbWkGjTEKQWX2cv9oH7wiN4OcEKd0gE2B3Z6Y_Q-u21Jsndl3sHd3pn63aEFYg6SCk7pdDjXNI9gCWdwwnDjmct7iZQriFPSDtlijXEZpPIIEQyi5EgCrFwwZou0Ppj6Tq-hIayAgU6RsfxDIi85XKY7Ixmk8oMa_BrKd/s1600/ce7e99b2-agent--e1544463165980.webp" alt="Dayana">
        <div><b style="display:block;">Dayana</b><small>● En línea ahora</small></div>
    </div>
    
    <div id="chat">
        <div class="msg bot">¡Hola! Soy Dayana. 😊 ¿A qué ciudad va tu pedido?</div>
    </div>

    <div id="input-area">
        <input type="text" id="userInput" placeholder="Escribe tu mensaje aquí..." autocomplete="off">
        <button id="sendBtn">🚀</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const k = "AIzaSyAdFnI6xHkmIHanSTZC4IIh7rxXyvhqS58";

        async function enviarMensaje() {
            const texto = userInput.value.trim();
            if (!texto) return;

            // Mostrar mensaje del usuario
            addMsg(texto, 'user');
            userInput.value = '';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${k}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Responde como Dayana, asesora de ventas. Sé breve y amable. Cliente dice: " + texto }] }],
                        safetySettings: [
                            { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    addMsg(data.candidates[0].content.parts[0].text, 'bot');
                } else {
                    addMsg("Lo siento, tuve un problema técnico. ¿Me repites? 😊", 'bot');
                }
            } catch (error) {
                addMsg("Error de conexión. Revisa tu internet.", 'bot');
            }
        }

        function addMsg(texto, tipo) {
            const div = document.createElement('div');
            div.className = `msg ${tipo}`;
            div.innerText = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        // Eventos para enviar
        sendBtn.addEventListener('click', enviarMensaje);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensaje();
        });
    </script>
</body>
</html>
