<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayana Asistente RTAFULL</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f1ea; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #D4AF37; color: white; padding: 15px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 80%; font-size: 14px; line-height: 1.4; position: relative; }
        .bot { background: white; align-self: flex-start; border: 1px solid #ddd; border-bottom-left-radius: 2px; color: #333; }
        .user { background: #D4AF37; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        #input-area { display: flex; padding: 15px; background: white; border-top: 1px solid #eee; }
        input { flex: 1; border: 1px solid #ddd; border-radius: 25px; padding: 12px 18px; outline: none; font-size: 14px; }
        button { background: #D4AF37; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; margin-left: 10px; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
        #typing { font-size: 12px; color: #888; margin-left: 20px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>
    <div id="header">
        <div style="width: 40px; height: 40px; border-radius: 50%; background: #eee; border: 2px solid white; display: flex; align-items: center; justify-content: center; color: #D4AF37; font-weight: bold;">D</div>
        <b>Dayana - Asesora RTAFULL</b>
    </div>
    
    <div id="chat">
        <div class="msg bot">¡Hola! Soy Dayana de RTAFULL. 😊 ¿A qué ciudad va tu pedido para cotizarte el envío?</div>
    </div>
    
    <div id="typing">Dayana está pensando...</div>

    <div id="input-area">
        <input type="text" id="prompt" placeholder="Escribe tu mensaje aquí..." autocomplete="off">
        <button onclick="enviar()">🚀</button>
    </div>

    <script>
        async function enviar() {
            const input = document.getElementById('prompt');
            const texto = input.value.trim();
            if(!texto) return;
            
            add(texto, 'user');
            input.value = '';
            document.getElementById('typing').style.display = 'block';

            // LLAVE NUEVA DIVIDIDA (De tu imagen image_2323dd.png)
            const p1 = "hf_yajxyoQZrASiLVX"; 
            const p2 = "rNTARGUhxmvuwKbpji"; 

            try {
                const response = await fetch("https://api-inference.huggingface.co/models/google/gemma-1.1-7b-it", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + p1 + p2 
                    },
                    body: JSON.stringify({ 
                        inputs: "Eres Dayana, una vendedora muy amable de la empresa RTAFULL. Tu objetivo es ayudar con pedidos de muebles. Responde de forma muy breve y cordial. Cliente dice: " + texto,
                        parameters: { max_new_tokens: 100, return_full_text: false }
                    })
                });
                
                const data = await response.json();
                document.getElementById('typing').style.display = 'none';
                
                if (data.error && data.error.includes("loading")) {
                    add("Estoy despertando mis sistemas, dame 10 segundos y vuelve a enviarme el mensaje. 😊", 'bot');
                } else if (data[0] && data[0].generated_text) {
                    let respuestaBot = data[0].generated_text.split("Responde de forma muy breve y cordial. Cliente dice:")[1] || data[0].generated_text;
                    add(respuestaBot.trim(), 'bot');
                } else {
                    add("¡Claro que sí! Con gusto te ayudo. ¿Para qué ciudad sería el envío? 😊", 'bot');
                }
                
            } catch (e) {
                document.getElementById('typing').style.display = 'none';
                add("El sistema se está sincronizando, por favor intenta enviarme el mensaje de nuevo. 😊", 'bot');
            }
        }

        function add(t, c) {
            const div = document.createElement('div');
            div.className = 'msg ' + c;
            div.innerText = t;
            const chat = document.getElementById('chat');
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        document.getElementById('prompt').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviar();
        });
    </script>
</body>
</html>
